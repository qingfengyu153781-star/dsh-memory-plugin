# _guard · 负例库（跨项目自检用）

> 每个项目一组"以前会犯的错"，喂给闸门，看它当场红。
> 闸门逻辑不认这些数据；换项目＝换一组用例。
> 字段：id / 闸门 / 用例说明 / 输入 / 期望（blocked|pass）

cases:
  # ---------------- 巫山女：S01-1 实测过的错 ----------------
  - id: W-01
    gate: spec
    desc: "路做成 4 条带（用户骂的『刨坑』）"
    expect: blocked
    measured:
      山道.宽度_m: 1.35
      山道.横断面带数: 4
      石磴.阶高_m: 0.15
      石磴.踏面_m: 0.65
      石磴.每级四角_gap_m: 0.015
      路_地形_高差_m: 0.02
      人物占画高: 0.22

  - id: W-02
    gate: spec
    desc: "路比地形悬 0.9 m（实测剖面 路 −0.93 / 地形 −1.81）"
    expect: blocked
    measured:
      山道.宽度_m: 1.35
      山道.横断面带数: 1
      石磴.阶高_m: 0.15
      石磴.踏面_m: 0.65
      石磴.每级四角_gap_m: 0.015
      路_地形_高差_m: 0.90
      人物占画高: 0.22

  - id: W-03
    gate: spec
    desc: "缺实测值就想蒙混过关（不许默认绿）"
    expect: blocked
    measured:
      山道.宽度_m: 1.35

  - id: W-04
    gate: spec
    desc: "合规的一版（不该误杀）"
    expect: pass
    measured:
      山道.宽度_m: 1.35
      山道.横断面带数: 1
      石磴.阶高_m: 0.15
      石磴.踏面_m: 0.65
      石磴.每级四角_gap_m: 0.015
      路_地形_高差_m: 0.02
      人物占画高: 0.22

  - id: W-05
    gate: obj
    desc: "未经确认就想删（『删掉盖住路的』）"
    expect: blocked

  - id: W-06
    gate: obj
    desc: "试图删用户认可的标准件（山道_A）"
    expect: blocked

  # ---------------- 枫独：这个项目自己的错 ----------------
  - id: F-01
    gate: spec
    desc: "团队人数写错（口径 6 人，写成 5）"
    expect: blocked
    measured:
      口径.团队人数: 5
      口径.比赛赛道: "职教赛道·创意组"
      文本.禁用词_定妆照: 0
      文本.禁用词_贷款: 0

  - id: F-02
    gate: spec
    desc: "文档里出现禁用词（定妆照）"
    expect: blocked
    measured:
      口径.团队人数: 6
      口径.比赛赛道: "职教赛道·创意组"
      文本.禁用词_定妆照: 3
      文本.禁用词_贷款: 0

  - id: F-03
    gate: spec
    desc: "合规的一版（不该误杀）"
    expect: pass
    measured:
      口径.团队人数: 6
      口径.比赛赛道: "职教赛道·创意组"
      文本.禁用词_定妆照: 0
      文本.禁用词_贷款: 0

  - id: F-04
    gate: obj
    desc: "试图改/删受保护的财务真相源（经济模型 xlsx）"
    expect: blocked
    objects:
      - {name: "10_经济模型_枫独.xlsx", verts: null, note: "数字单一真相源"}
