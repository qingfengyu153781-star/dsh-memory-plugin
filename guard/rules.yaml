    rule: 对抗样本电池——支持文本输入的闸，必须各配一对样本：**must_block**（打扮得体但违规）必须判红**且**判据必须"到达"（输出里出现该判据的标记），**must_pass**（正规产出）必须判绿。三类病分别对应：判红不了＝**假通过**；判红但判据没到达（整段跳过）＝**假根治**（按措辞逃逸）；误拦合规样本＝**假报错**。不吃文本输入的闸必须登记在 `adversarial_battery.DEMO_ONLY` 并写明原因（**不许"没样本＝通过"**），由 `--demo` 覆盖
