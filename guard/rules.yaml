# _guard · 规矩台账（AGENTS.md 的每条规矩 → 哪道闸在跑）
#
# 存在的理由（2026-10-03 用户点破）：
#   「<用户原话已隐去：文档会忘，要把规矩接成能跑的>」
#   AGENTS.md 靠"读到+记住"生效，换会话就漂；闸门靠"跑"，不依赖记性。
#   所以每条规矩都必须登记：**谁在跑它**。裸规矩（gate: none）= 待补闸。
#
# 字段：
#   id       规矩编号（R-xx）
#   rule     规矩一句话
#   src      AGENTS.md 里的定位（章节名，便于回查）
#   gate     哪道闸在跑它（g_xxx.py 的文件名，不含 .py）；none = 裸规矩
#   check    可执行的检查动作（能跑、有退出码的优先）
#   kind     enforced(机器拦) / detected(机器能查但不能拦) / advisory(仅提示)

rules:
  - id: R-01
    rule: 与用户的一切交流一律用中文
    src: "铁律 · 用中文交流"
    gate: g_lang
    check: "python _guard/gates/g_lang.py --text-file <文件>"
    kind: enforced

  - id: R-02
    rule: 先查自己有什么能力再动手，命中就加载
    src: "铁律 · 先查自己有什么能力"
    gate: g_cap
    check: "python _guard/guard_cli.py capability"
    kind: enforced

  - id: R-03
    rule: 关键数字必须溯源原文，标注出处层级
    src: "铁律速查"
    gate: g_probe
    check: "python _guard/gates/g_probe.py --demo"
    kind: enforced

  - id: R-04
    rule: 输出断言必须先实测（兜底能力≠卖点）
    src: "铁律速查"
    gate: g_root
    check: "python _guard/guard_cli.py root-demo（B7_verify：推断不许多于实测）"
    kind: enforced

  - id: R-05
    rule: 改已有文件先备份（_bak_YYYYMMDD_HHMM）
    src: "铁律速查"
    gate: g_vault
    check: "python _guard/guard_cli.py vault-list"
    kind: enforced

  - id: R-06
    rule: 产出先落盘再对话（写入优先）
    src: "铁律速查"
    gate: g_done
    check: "python _guard/gates/g_done.py --demo"
    kind: enforced

  - id: R-07
    rule: DSH 产生的文件一律放 D:\\agent 下，cc-assets 只读
    src: "文件写入铁律"
    gate: g_path
    check: "python _guard/gates/g_path.py --write-path <路径>"
    kind: enforced

  - id: R-08
    rule: 动手前先查技能索引，命中的技能全部加载
    src: "技能强制使用协议"
    gate: g_cap
    check: "python _guard/guard_cli.py capability"
    kind: enforced

  - id: R-09
    rule: 做 3D 预演前必须先加载 wushannv-3d-previs / -acceptance
    src: "★★★ 做 3D 预演之前"
    gate: g_cap
    check: "python _guard/guard_cli.py capability（触发词命中检查）"
    kind: enforced

  - id: R-10
    rule: 做任何东西都要考虑合理性（不懂技术的人看会不会觉得荒唐）
    src: "最高优先级铁律"
    gate: g_done
    check: "g_done 的『合理性一问』检查项"
    kind: enforced

  - id: R-11
    rule: 数字全绿但现实荒唐 ⇒ 按不通过处理
    src: "最高优先级铁律 · 执行方式"
    gate: g_done
    check: "g_done absurd_answer 必填"
    kind: enforced

  - id: R-12
    rule: 解不出来就报回来，不许硬调参数凑（连续调参 ≥3 次仍无果即判硬凑）
    src: "最高优先级铁律 · 执行方式"
    gate: g_behavior
    check: "python _guard/guard_cli.py behavior --text-file <文本>   # B1"
    kind: enforced

  - id: R-13
    rule: 用户已拒绝的方案绝不再搬上来（对照已拒绝清单；否定语境不算）
    src: "复盘索引 · 镜8 教训"
    gate: g_behavior
    check: "python _guard/guard_cli.py behavior --text-file <文本>   # B2（清单见 config.behavior.rejected）"
    kind: enforced

  - id: R-14
    rule: 绝不擅自提交（用户没说提交之前只给方案）
    src: "复盘索引 · 镜23a 教训"
    gate: g_path
    check: "python _guard/gates/g_path.py --code-file <脚本>"
    kind: enforced

  - id: R-15
    rule: 意图不明/与确认冲突 ⇒ 先问不脑补
    src: "复盘索引 · 镜8 教训"
    gate: g_intent
    check: "python _guard/guard_cli.py intent-selftest"
    kind: enforced

  - id: R-16
    rule: 报告里的引用必须带取数时刻（md5/行号/计数会过期）
    src: "_guard · g_root"
    gate: g_root
    check: "python _guard/guard_cli.py root-demo（B2_cite）"
    kind: enforced

  - id: R-17
    rule: 报"已改"必须附 reopen 后的实测值
    src: "_guard · g_root"
    gate: g_root
    check: "python _guard/guard_cli.py root-demo（B3_reopen）"
    kind: enforced

  - id: R-18
    rule: 量具必须有身份证（帧/归零遍/算法/文件集）
    src: "_guard · g_root"
    gate: g_root
    check: "python _guard/guard_cli.py root-demo（B4_ruler）"
    kind: enforced

  - id: R-19
    rule: 报"没有"必须同时报扫描范围
    src: "_guard · g_root"
    gate: g_root
    check: "python _guard/guard_cli.py root-demo（B5_scope）"
    kind: enforced

  - id: R-20
    rule: 改一处必须扫同类并报命中数
    src: "_guard · g_root"
    gate: g_root
    check: "python _guard/guard_cli.py root-demo（B6_sweep）"
    kind: enforced

  - id: R-21
    rule: 判据必须声明"要保证的量"（不许只量过程量）
    src: "_guard · g_root"
    gate: g_root
    check: "python _guard/guard_cli.py root-demo（B1_target）"
    kind: enforced

  - id: R-22
    rule: 删/改之前，语义谓词必须先打印成清单
    src: "_guard · g_obj"
    gate: g_obj
    check: "python _guard/gates/g_obj.py --demo"
    kind: enforced

  - id: R-23
    rule: 标准必须写成可执行断言，不合规不许存盘
    src: "_guard · g_spec"
    gate: g_spec
    check: "python _guard/gates/g_spec.py --demo"
    kind: enforced

  - id: R-24
    rule: 报绿之前必须先自证探针（正例绿+负例红）
    src: "_guard · g_probe"
    gate: g_probe
    check: "python _guard/gates/g_probe.py --demo"
    kind: enforced

  - id: R-25
    rule: bash 里 /d/agent 不是 D 盘，产出落盘别用 bash
    src: "★ bash 工具路径陷阱"
    gate: g_path
    check: "python _guard/gates/g_path.py --cmd-text \"<命令>\""
    kind: enforced

  - id: R-26
    rule: 写提示词前先加载对应技能并用当前版本
    src: "技能强制使用协议"
    gate: g_cap
    check: "python _guard/guard_cli.py capability"
    kind: enforced

  - id: R-27
    rule: 能看图就直接 read_image；不许用像素统计代替看图下语义结论（像素统计只能判色偏）
    src: "视觉能力提醒（2026-10-03 修正：read_image 已打通，旧表述『看不了图时绕道』已过时）"
    gate: g_behavior
    check: "python _guard/guard_cli.py behavior --text-file <文本>   # B3"
    kind: enforced

  - id: R-28
    rule: 用户说"有"就是有，不许拿第二次核对去反驳（用户是最终裁判）
    src: "复盘索引 · 镜19a 教训"
    gate: g_behavior
    check: "python _guard/guard_cli.py behavior --text-file <文本>   # B4"
    kind: enforced

  - id: R-29
    rule: 成果报告必须按结构写（有那七栏），不是"措辞对了就算"
    src: "_guard · g_struct（治本）"
    gate: g_struct
    check: "python _guard/guard_cli.py struct --text-file <报告>"
    kind: enforced

  - id: R-30
    rule: 视觉能力跟随当前模型；模型看不了图必须明说"无法看图"，不许假装核过
    src: "_guard · g_vision（用户 2026-10-03 点名）"
    gate: g_vision
    check: "python _guard/guard_cli.py vision --capability"
    kind: enforced

  - id: R-31
    rule: 细线级细节要人眼判时，必须先在图上画框+编号+放大（没框的请求等于没问）
    src: "_guard · vannot（用户 2026-10-03 点名）"
    gate: vannot
    check: "python _guard/guard_cli.py annotate --image <图> --boxes ..."
    kind: enforced

  - id: R-32
    rule: 视觉结论必须有据（说是哪张/哪一帧），且细线级不许拿模型结论判废
    src: "_guard · g_vision（复盘 镜19a 教训）"
    gate: g_vision
    check: "python _guard/guard_cli.py vision --text-file <报告>"
    kind: enforced

  - id: R-33
    rule: 宣布方案前必须核决策过程（有比选/有判据/判据可复算/不撞已拒绝清单）
    src: "_guard · g_decision（用户追问『为什么核不了方案好不好』）"
    gate: g_decision
    check: "python _guard/guard_cli.py decision --text-file <方案>"
    kind: enforced

  - id: R-34
    rule: 实测值必须指到可查来源（台账/探针/命令/日志），手写的不算实测
    src: "_guard · g_xcheck X6（用户点名『改了没测也要解决』）"
    gate: g_xcheck
    check: "python _guard/guard_cli.py xcheck --text-file <报告> --items X6"
    kind: enforced

  - id: R-35
    rule: 报告里的关键读数必须与台账对得上（对不上＝读数可疑）
    src: "_guard · g_xcheck X7"
    gate: g_xcheck
    check: "python _guard/guard_cli.py xcheck --text-file <报告> --items X7"
    kind: enforced

  - id: R-36
    rule: 记忆文件不得超注入上限（超了末尾会静默截断，规矩悄悄失效）
    src: "_guard · g_doc D1（2026-10-03 实测：67,792 B 超 65,536 B，最高优先级铁律被截掉）"
    gate: g_doc
    check: "python _guard/guard_cli.py doc"
    kind: enforced

  - id: R-37
    rule: 声明"最高优先级"的章节必须排在文件前部（排最后＝必然第一个被截）
    src: "_guard · g_doc D2（2026-10-03 用户明令「改」）"
    gate: g_doc
    check: "python _guard/guard_cli.py doc"
    kind: enforced

  - id: R-38
    rule: 索引就是索引 —— 详情落盘，索引段不得塞详情（塞了会挤掉正文）
    src: "_guard · g_doc D3（复盘索引曾占全文 59%）"
    gate: g_doc
    check: "python _guard/guard_cli.py doc"
    kind: enforced

  - id: R-39
    rule: 文件里的数量声明必须与实测一致（写"28 条规矩"而实际 35 条＝口径不一致）
    src: "_guard · g_doc D4（实测抓出 AGENTS.md 数字过期）"
    gate: g_doc
    check: "python _guard/guard_cli.py doc"
    kind: enforced

  - id: R-40
    rule: 跑重活（ASR/大模型/视频生成/长渲染）前先实测可用内存，不够就降档或拒绝开跑
    src: "_guard · g_mem（2026-10-03 立：两个子智能体在 ASR 中途 OOM 死掉，`mkl_malloc: failed to allocate memory`；文档里那条『15.7GB 是硬墙』此前没有闸在跑）"
    gate: g_mem
    check: "python _guard/gates/g_mem.py            # 报本机内存 + 三档是否够
python _guard/gates/g_mem.py --tier asr   # 单判某档（asr/heavy/light）
python _guard/gates/g_mem.py --text-file <报告>  # 判报告里提到的重活档位"
    kind: enforced

  - id: R-41
    rule: 报机位/构图结论必须同时给「焦距(mm)＋距离(m)＋主体尺寸或视场(m)」三要素；三缺一即视为“机位是猜的”，结论作废。禁止“先给个机位试试看”、禁止用镜头数反推距离、禁止拿“图不好看”否定几何
    src: "用户 2026-10-04 点名『你以前看建模的图片的时候是不是从来没有考虑过镜头焦距和距离？』；当日实测病根：报机位凭感觉（站 y=-90 / 50mm 看山），连带①相机贴山面/满屏主体 ②拿图不好看否定几何（山被否定十几轮，真因只是镜头太近）③同一机位反复试 6 次全失败"
    gate: g_vision
    check: "python _guard/gates/g_vision.py --text-file <报告>   # 缺『焦距/距离/主体尺寸』任一项即拦
# 反例（该拦）：『机位定在 y=-90、镜头 50mm』 → 机位是猜的
# 正例（该放）：『主体山高 108 m，要占画面 1/1.4（视场 151 m），50 mm ⇒ 距离 373 m，相机 y=-273』
# 闭式解（16:9，sensor 竖直 20.25mm）：d = f × H / 20.25"
    kind: enforced

  # ══════════════════════════════════════════════════════════════════════
  # ★ 2026-10-04 新增：**要求类**规矩（此前 41 条全是"做法类"，要求类 = 0 条）
  #
  # 用户点破：「建模的问题固化进知识库，为什么我的要求后面还是会跑偏？」
  # 实测：闸 41/41 全接上、编排器 179 次成功，**但 41 条里没有一条管"用户要求有没有被执行"**。
  # ⇒ 闸能保证「做得对不对」，保证不了「是不是用户要的那件事」。
  # 实证代价：巫山女会话 142 轮，构件全合规，整座山方向错 ⇒ 42 轮返工后整座山被删。
  # ══════════════════════════════════════════════════════════════════════

  - id: R-42
    rule: 开轮必须把用户原话落成「要求锚」(BRIEF)，收尾时必须逐条对账；凡宣布完成/交付/达标，BRIEF 里不许有「未兑现」项
    src: "用户 2026-10-04『为什么我的要求后面还是会跑偏』；实证：巫山女 4 次自宣交付（seq 10185/10353/10483/10582）时，8 条要求里 R1/R6/R8 三条全程未达标，无任何闸拦下"
    gate: g_brief
    check: "python _guard/gates/g_brief.py --init --session <会话.jsonl> --goal \"<goal原文>\" --out BRIEF.md
python _guard/gates/g_brief.py --text-file <报告> --brief BRIEF.md
# 反例（该拦）：BRIEF 有未兑现项，报告写「# 交付：…」或「…已完成」 → 红，退出码 1
# 正例（该放）：BRIEF 全部已兑现 / 报告未宣布完成 → 绿"
    kind: enforced

  - id: R-43
    rule: 声称「用户选了/用户要求/按你的意思」必须给出处（turn=N / seq=N / 逐字引号），给不出即视为脑补
    src: "实证：巫山女 seq=1783 写「你选了『白模级』」而无出处（该决定实际在 seq=1780）；同类措辞在会话中反复出现且从不带出处"
    gate: g_brief
    check: "python _guard/gates/g_brief.py --text-file <报告> [--brief BRIEF.md]
# 反例（该拦）：『你选了「白模级」，所以我按白模做。』
# 正例（该放）：『你选了「白模级」（turn=4 / seq=1780），所以我按白模做。』"
    kind: enforced

  - id: R-44
    rule: 「用户原话」只认 source.kind=='user' 与 ask_user_question 的真实答复；goal/team-message/runtime-context 等注入内容一律不得当用户原话
    src: "实证：巫山女会话 663 条 user/message 里只有 35 条是真人原话（其余 628 条是注入）；把注入当原话是『要求被曲解』的第一大来源"
    gate: g_brief
    check: "python _guard/gates/g_brief.py --init --session <会话.jsonl> --out BRIEF.md
# 判据：抽出的条数须与 source.kind=='user' 的实际条数一致（巫山女应为 35 + 4）"
    kind: enforced

  - id: R-45
    rule: 不理解或有疑问 ⇒ 必须先提问，绝对不开工；提问后未获答复也不许开工。同时禁止滥问——答案已写在剧本/台账/文档里的，先自己查，查不到再问
    src: "用户 2026-10-04 明令『增加一个闸用于理解用户真正的需求，不理解或者有疑问就使用提问，绝对不开工』；实证代价：巫山女会话用户要『巍峨嶙峋』，Lead 没问『什么样的算巍峨』就按坡度直方图猜了 20+ 轮，最终 42 轮造山全废、整座山被删（seq 10660/10689）"
    gate: g_ask
    check: "python _guard/gates/g_ask.py --demo                              # 负例自检
python _guard/gates/g_ask.py --note \"<要做的事>\" [--ask <问题>]...  # 开工前拦
python _guard/gates/g_ask.py --text-file <报告>                      # 报告级事后抓
python _guard/gates/g_ask.py --check-asked --ask \"<问题>\"           # 防滥问：该自查的别问用户
# 反例（该拦）：『我先按 X 理解…先做着看』且无提问记录 → 红
# 反例（该拦）：『07_场景设计.md 里写的丹房位置是哪个？你定一下』 → 先自查来源
# 正例（该放）：计划明确、无疑点、无猜测措辞 → 绿"
    kind: enforced

  - id: R-46
    rule: 验收判据必须量对对象——宣称「通过/达标/残留0」必须同时给出①量的什么量（单位）②扫描范围（查了哪里）③对应用户哪条要求；且同一判据连续 N 轮输出完全相同即判「已钝化」（永远为真的判据不产生信息）
    src: "用户 2026-10-04『补洞没用要根治』；实证：《联网学习Blender建模》会话 seq=717 的 final_check.py 把用户『别占空间』翻成『有没有 mp4 后缀』，连续 29 轮打印『媒体残留 0 ✅』，而 _tmp_video_learn 实存 907 文件 / 72.2 MB（比知识库本体 28.6MB 还大 2.5 倍）⇒ 15h50m / 3004 万 token 换来用户一句『不合格』"
    gate: g_criteria
    check: "python _guard/gates/g_criteria.py --demo                        # 负例自检（用真实那句『媒体残留 0』）
python _guard/gates/g_criteria.py --text-file <报告>             # 查判据是否声明量纲/范围/要求锚
python _guard/gates/g_criteria.py --check-stale                  # 查判据钝化（连续 N 轮雷同）
python _guard/gates/g_criteria.py --record \"名|判据原文\"          # 记一条判据进台账
# 反例（该拦）：『验收通过：**273.3 KB / 18 篇**，媒体残留 **0**。』→ 说不出范围与要求锚 → 红
# 反例（该拦）：同一判据连续 ≥5 轮输出完全相同 → 判钝化 → 红
# 正例（该放）：『R4 达标：对 <WORKSPACE> 全盘 du -sh，总量 72.2 MB（阈值 5MB）』→ 绿
# 正例（该放）：本轮未做验收（无『通过』字样）→ 未核 → 不拦"
    kind: enforced

  - id: R-47
    rule: 批量任务（下载/转写/渲染/导出…）必须以「完成率达标」为出口条件；出现 ok=0、或完成率低于阈值、或日志有中断字样而报告不交代剩余 ⇒ 不许进入下一阶段
