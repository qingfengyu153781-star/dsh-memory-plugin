  # ★ 2026-10-15 新增（学自灵枢记忆面设计：来源六问 / #217 来源洗白）

  - id: R-60
    rule: 来源契约（六问）——记忆库的**来源面**必须能回答灵枢 `provenance.py` 的六问（谁说的 / 在哪观测 / 用什么工具 / 哪个会话 / 什么时候 / 验证过没有），且：①库中每个 **(source, kind, role)** 组合必须在登记表里显式声明（未声明即红——灵枢 §6.1「不静默放行新 kind」同款；**按 source 粒度**是因为同一 kind 在不同来源里 role 不同，只登记 kind 会看不见"某来源新学了一套口径"）②**来源洗白**双向不许：非真人 kind 不得落真人角色，真人 kind 必须落真人角色（灵枢 #217）③**声明与事实一致，双向查**：声明「提供」⇒ 缺口不超基线（**只防新增**）；声明「代理」⇒ 须写明差在哪；声明「不提供」⇒ 须写原因且库里确有高覆盖列时判红；声明**「排除某源」⇒ 该源必须确实接近全缺**（否则排除声明过期 ⇒ 红）；`mode=presence` 的问项该列必须**每行都有显式取值**④`prov` 语义声明须与实键一致。另报 P5 读数：已核验条数与方法面（**「unverified」是显式状态，不等于「已验证」**）
    src: "2026-10-15 立，学自 lingshu `core/provenance.py`（动机原话：注入内容混进用户真实对话，事后只能靠 tags LIKE 猜类别、猜错就归错桶）+ `longterm_gate.py:301-317` 的 SOURCE_RESERVED_TAGS（#217）。我们这边**实测（只读 index/memory.sqlite，32.5 万原子）**：六问里只答得出 2.5 问；★ 且 `prov` 列 100% 覆盖却是**文件出处**（{file,line}），**不是**来源契约；`tool_result` 的 tool_name 缺 **98,978** 条；410 条无时间戳**全部**来自 cursor（其原始记录顶层只有 {role,message}，**源头就没有**，故显式排除、不臆造）。同日完成数据侧修复：schema v2（+4 列）＋按 (session_id,call_id) 回填 tool_name **98,845** 条＋回填观测位 **326,106** 条＋新建两条真能跑的核验通路（raw_reopen / cross_source）"
    gate: g_prov
    check: "自动路：hook.py 的 guard_prov()（**增量档**毫秒级只核新原子；每 900 s 或 force 走**全量档**；跳过会写进返回值带 skipped=True，不许当通过）。手敲：guard_cli.py prov（全量）｜prov --incremental（增量）｜prov --demo（造 **10 个库**自证：好库绿 + 9 类坏库各必须红——洗白/未声明组合/**换来源换口径**/prov 语义不符/新增缺口超基线/声明低于事实/缺原因/拿排除放水/presence 留空）。数据侧：bin/mem.py repair-provenance [--apply]、verify-atoms [--apply]。登记表：tools/prov_registry.json（**冻结声明**，闸不会自动更新它）"
    kind: enforced

  # ★ 2026-10-15 新增（学自灵枢 #263：维护周期不许往记忆图写自己的日志）

  - id: R-61
    rule: 自写自读——**自检/维护/演示**的痕迹**不得**写进被检索的记忆面：①生产库中自检/测试/桩类会话的原子必须为 0 ②生产库中维护/自检日志类 kind 的原子必须为 0（灵枢 #263：维护周期每跑一轮写一条自己的统计日志，实测 300 轮里知识层 571 条有 173 条是日志，还会被归纳成"概念"、被召回）③会**写**记忆库的代码，凡属自检类者**必须显式带隔离根**（`DSH_MEMORY_BASE`/`tempfile`/`--db`/`mode=ro`）④自检类写入必须有**审计面**可落（挡而不丢）
    src: "2026-10-15 立，学自 lingshu `core.py::consolidate_cycle` 的 #263（维护周期净写入 + 未复核概念被自抬到 1.0）。我们的对应事故：自检套件曾往**生产台账**写 `selfcheck-session` 行 ⇒ `orch_status.py` 把生产台账判成 STATUS=broken（**自检污染了它自己要读的真相源**）；当时的修法（隔离到临时库）只在代码里、**没有尺子在守**——本闸就是那把尺子"
    gate: g_selfwrite
    check: "手敲：python _guard/guard_cli.py selfwrite（绿=现库 0 条自检痕迹 + 扫描面 38 个 .py 里会写库的 2 个都有隔离）；--db-only 只核库；负例自检：selfwrite --demo（造坏库 A/B + 造坏源码，三类坏输入都必须当场红；另有 1 例显式声明本闸的**判据边界**：改名文件不属自检类路径面）"
    kind: enforced

  # ★ 2026-10-15 新增（学自灵枢「每处修复必写边界（削掉的判别力，如实标注）」）

  - id: R-62
    rule: 边界声明——报告里一旦出现**完成类断言**（已根治/已修复/已改完/处理完毕/零残留/彻底解决…），就必须有一栏写清**这次没修什么**（栏目名：边界/遗留与风险/本次未修/已知缺口…；栏内要有「未修：/遗留：/未做：/未扫：/盲区：/缺口：」**其一**即可——6 个是**同义别名**，由 `fields_mode: any` 实现，不是"全都要"）。只报修好的、不报没修的 = **谎报完整**
    src: "2026-10-15 立，学自 lingshu `core.py` 的修复注释体例——#176/#205/#257/#263 每处都带一段『**边界（削掉的判别力，如实标注）**』，写明这次没解决什么、代价是什么（如 #176 明写『副本合一未做』『now=None 时不做时间记账』）；其设计稿亦明写『缺口与待裁事项单列，不谎报完整』。★ 同日修了两处**假报错**：`find_section` 只取第一个同义栏（§1.5 诚实边界 vs §边界 并存时合格那栏从没被看过）；`fields` 一律按 all-of 判（把『其一』实现成『全都要』⇒ 只写『未修：』的合格报告被判缺 5 个字段）。同族还把 S2（实测于/取数时刻/截至）也改为 any-of"
    gate: g_struct
    check: "自动路：hook.py 的报告闸（写报告时拦）；手敲：python _guard/gates/g_struct.py --text-file <报告>；负例自检：guard_cli.py selftest 里的 struct --demo；样本对：tools/adversarial/struct/{must_block,must_pass}.md（must_pass 已按 R-62 补『未修：/边界：』两行）；改闸后按 R-59 重跑该闸样本对"
    kind: enforced

  # ★ 2026-10-15 新增（一天里 6 次 SyntaxError + 4 次 JSON 写坏，全靠"跑起来才发现"）

  # ★ 2026-10-16 新增（起因：脑融合的回归用例写完了，却不在该项目的 test 脚本里）

  # ★ 2026-10-16 新增（学自 hive-memory-bench 的公开结论：压缩丢的是「对面那一块」）

  - id: R-68
    rule: 核验器**不得与被检对象同源**——判据件不得 import 被检对象模块；**必须有自证入口**（--demo/--selftest）；声明了被检产物却只有它一个依据 ⇒ 记**未验**
    src: "2026-10-16 立。学自 dsh-bounty 的账本自审件思路（该仓明写『本文件不 import bounty_board，id 公式独立重实现 —— 当独立见证者，避免同错同绿』；该仓 license=None，故本闸为自研实现）。本仓同源风险：g_prov 读 memlib 写的库、g_integ 跑被检对象自己的测试 ⇒ 同源判据给不出独立证据"
    gate: g_witness
    check: "手敲：guard_cli.py witness（读 tools/witness.json）；负例自检：witness --selftest（同源必红 / 无自证入口必红 / 独立+自证才绿 / 声明被检产物记未验）；自动路：hook.guard_witness"
    kind: enforced

  - id: R-69
    rule: **跑完不许把仓搞脏**——声明的每个 git 仓，生成器/闸/探针跑完后 `git status --porcelain` 必须为空（允许清单须**显式声明**）；不是 git 仓 / git 不可用 ⇒ **未验**（不许当干净）
    src: "2026-10-16 立。学自 dsh-bounty 的 CI（review-check.yml『跑完不许把仓搞脏』；该仓 license=None，故本闸为自研实现）。本机复跑实测：该仓跑完全部生成器后 git status --porcelain 为空 ✓；本仓风险：_guard 频繁写台账/快照/备份，一旦写到受版本管理的文件上，没有任何判据会报"
    gate: g_clean
    check: "手敲：guard_cli.py clean（读 tools/clean.json）；负例自检：clean --selftest（造一条未提交必红 / 白名单放行 / 非 git 记未验）；自动路：hook.guard_clean"
    kind: enforced

  - id: R-67
    rule: **覆盖 ≠ 蕴含**——凡以"关键词/要点出现过"为依据声称"语义存活 / 结论成立"，必须附**极性/否定核对**；声明与引文极性相反 ⇒ 红；**两侧都没提到 ⇒ 未验（不等于通过）**
    src: "2026-10-16 立，来源 hive-memory-bench（符荣峻）自曝口径：『L2′ 关键词覆盖只量术语出现过没有——对极性/否定/语序不敏感（把「必须」改成「不必」不会压低它），**它不是蕴含/正确性检查**；原名「语义存活」已弃用』。本仓同族风险：采分点覆盖、术语核对都可能被当成"结论成立"；而本工作区最重扣分面恰是"把未验写成已验""
    gate: g_polarity
    check: "手敲：guard_cli.py polarity --claim '…' --quotes quotes.json（quotes.json 可写 {\"quotes\":[…],\"coverage_only\":true} 表示依据只有覆盖）；负例自检：polarity --selftest（极性反转必红 / **纯关键词覆盖必红** / 两侧都没提=未验 / 极性一致才绿）；自动路：hook.guard_polarity（配置驱动，未配则显式写「判据未跑，非通过」）"
    kind: enforced

  - id: R-66
    rule: 改写源码**禁止用 shell 拼**（bash heredoc / `python - <<EOF` 往 `.py` 里灌多行文本）——一律走 `write`/`edit` 或 `_guard/tools/safe_patch.py`；且**任何落盘的 .py/.json/.js 都要被"近期写入兜底"扫到**（来源无关）
    src: "2026-10-16 立。同日我**4 次**用 shell 拼 `.py`，双重转义（bash→python→字符串→正则）把 `\\n` 变成真换行 ⇒ 写出断行字符串（4 次都靠"跑起来才发现"，其中一次当场把 hook.py 写成 SyntaxError）。根因不是记性：是**工具选错了**。故：①给替代工具 `tools/safe_patch.py`（JSON 驱动、逐处必须唯一命中、改前备份、改后体检不过就回滚）②给兜底闸：`g_syntax --recent N` 扫**近 N 分钟落盘的**文件，不管谁用什么方式写的 ⇒ 把"我记得检查"换成"盘上一律体检""
    gate: g_syntax
    check: "手敲：guard_cli.py syntax --recent 15 ｜ syntax --files a.py b.json ；替代工具：python _guard/tools/safe_patch.py spec.json（自证：用它在文件里写入**真换行**，落盘正确 + 备份 + 体检 ok）；自动路：hook.guard_syntax_changed 既查本次改动、又扫近 15 分钟落盘面（兜底）"
    kind: enforced

  - id: R-65
    rule: 检索/摘要**不得只剩支持自己的那半**——凡"支持与反证同时存在"的判断，必须报**两侧存活率**；**对面那一侧**（与题面词面不重叠的一方）存活率显著低于己方 ⇒ 判红；**一对都没验上**同样是红（"没验"≠"无偏差"）
    src: "2026-10-16 立，来源 hive-memory-bench（符荣峻，CC BY 4.0 / 代码 MIT）结论三：『压缩丢的不是随机信息，是「对面那一块」』——抽样按与提问的相似度选段，而矛盾的另一侧恰与提问词面不重叠 ⇒ 系统性丢掉；且该机制被独立复现两次（一次由压缩触发、一次由更聚焦的检索触发）。**本仓自己的实例**：2026-10-15 我断言『删除=去重、内容没丢』，实测 371 条无副本 ⇒ 对面那一块当时根本不在我的检索里；同族错误还有『拿关键词覆盖冒充语义存活』（该文自述 L2′ 对极性/否定不敏感）"
    gate: g_directional
    check: "手敲：guard_cli.py directional --pairs pairs.json --retrieval 片段目录 [--tol 0.2]；负例自检：directional --selftest（只保 a 侧必红 / 两侧都不在必红 / b 侧改写冒充必红 / 两侧都在才绿）——★ 该自检首次运行时**抓出本闸自己的假通过**（两侧都不在曾判绿），已修"
    kind: enforced

  - id: R-64
    rule: 集成回归必须**自动跑**——改动**命中声明的面** ⇒ 必须真跑该项目的集成回归；**未命中要显式写「未跑」**（"没跑"≠"通过"）；跑不动/超时/配置坏 ⇒ 一律**判红**
    src: "2026-10-16 立。实测起因：2026-10-15 把灵枢脑**融合**进 `dsh-memory-plugin` 后，我写了端到端回归 `test/brain_fusion.mjs`（10 条：融合接上没？块是不是一个？验证态有没有被四态资格冒充？脑不可用时有没有写明原因？），**手敲跑通就收工**；次日复核 `package.json` 才发现 `test` 脚本是 `selfcheck && inject && orch_regress` —— **唯独没有它** ⇒ 下次靠人记得跑，忘了等于没有。这与本工作区反复栽过的形态**同源**：「规矩写下了 ≠ 有东西在跑它」。另附当日自证：搭这道闸的过程中我又用 bash heredoc 把换行写成真换行、当场把 `hook.py` 写坏（同日第 3 次），被 `g_syntax`(R-63) 当场拦下"
    gate: g_integ
    check: "自动路：hook.py 的 guard_integ() 在 Hook.after 里按**本次改动的文件**比对 `tools/integrations.json` 声明的面（命中才跑，不命中写明未跑）；手敲：guard_cli.py integ --changed 'plugin-src/dsh-memory-plugin/lib/index.js' ｜ integ --all ｜ integ --json；负例自检：integ --demo（坏命令必红 / 超时必红 / 配置坏必红 / 未命中必须写明「未跑」）"
    kind: enforced

  - id: R-63
    rule: 语法/格式当场合规——**本次改动过的每个 `.py` 必须 `compile()` 通过、每个 `.json` 必须 `json.loads()` 通过**；读不了/编译不了一律**报红**，不许当"跳过"（fail-closed）
    src: "2026-10-15 立。实测同日：①**6 次**在中文串里嵌 ASCII 双引号（`print(\"…写成\"不提供\"却不写原因…\")`）⇒ `SyntaxError`，其中 2 次让**闸自己**瘫掉 ②**4 次**把 JSON 写坏（真实换行没转义 / 中英引号混用）⇒ `g_prov` 对登记表解析失败是 fail-closed，**闸自己判红** ③★最讽刺的一次：**在修这道闸的过程中**又犯了一次（heredoc 把 `\\n` 写成真换行，当场把 `hook.py` 写坏）⇒ 证明这不是记性问题，是**没有自动检查**"
    gate: g_syntax
    check: "自动路：hook.py 的 guard_syntax_changed() 在 Hook.after 里对**本次改动的文件**逐个跑（毫秒级，不写 .pyc）；手敲：guard_cli.py syntax --files a.py b.json ｜ syntax --changed 'a.py;b.json'；负例自检：syntax --demo（临时目录里造好文件 + **坏 .py（正是我犯的那个形态）** + **坏 .json（真实换行）**，坏的两个必须都红）"
    kind: enforced
