  # ★ 2026-10-15 新增（注意力编排器「提示不正确」的根治；自噬闭环的源头）

  - id: R-58
    rule: 记忆库管道卫生——**非真人来源**的消息（`source.kind` = `plugin:*` / `time-context` / `runtime-context` / `agent-instructions` / `tool-jobs`）**不得**被记忆库登记成"用户原话"（`kind='user_text'`）。判据走 **fail-closed 白名单**：只有 `kind=='user'` 才算真人；其余一律存成 `plugin_injection` 且列入 `pipeline.NO_CHUNK`——**存得下、可审计、但进不了 chunks、检索不到**（挡而不丢）
    src: "2026-10-15 立。实证（同一把尺子，清洗前 vs 清洗后）：`kind='user_text'` 且文本以注入标签开头的原子 **3704 条**（`<memory_recall` 2687 / `<attention_orchestration` 326 / 运行环境快照 3137 / 时间上下文 2620），`chunks.user_text` 含注入标签 **83464** 个；真人 `user_text` 从 24360 → **6933（29%）** —— 也就是说索引里当时有 71% 的「用户原话」不是用户。病根：`src/memlib/dsh.py` 的 `user/message` 分支只看记录类型、**不看 `data.source.kind`**，而原始记录里本来就带 `{\"kind\":\"plugin:dsh-memory-plugin\"}` 标记。后果：注入块里写着用户这一轮的逐字 query ⇒ 召回时稳定排前 ⇒ **编排器把上一轮自己的输出当证据再注入**（台账里 18.6% 的『出处』就是这么来的，甚至填的是上一次的注入块本身）"
    gate: g_mem_hygiene
